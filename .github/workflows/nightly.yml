# Phase 05 nightly validation (docs/phases/phase-05.md scope 4): simulated metrics of the BRAS
# validation scenes against the committed baseline (tests/golden/validation_baseline.json), the
# bias-hook self-test (debug render_cli), the comparison report with measured IRs (artifact).
# Linux only. Runs nightly, on demand, and on pull requests that touch the validation.
# Skip gate (as ci.yml): if the validation already passed on a tree with the same fingerprint
# (tools/ci/ci_fingerprint.py), the job is skipped and the gate links the run that passed. The
# scheduled run therefore validates only when main changed since the last passing run.
name: nightly validation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run the validation even if this tree's fingerprint already passed
        type: boolean
        default: false
  pull_request:
    paths:
      - "tools/validation/**"
      - "tests/scenes/validation/**"
      - "tests/golden/validation_baseline.json"
      - "src/sim/**"
      - ".github/workflows/nightly.yml"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip gate: the same fingerprint as ci.yml, with its own marker key (nightly-pass-*). Markers saved
  # on main (scheduled runs) are visible to every PR; a PR's markers to that PR only.
  changes:
    name: changes (skip if this tree already passed the validation)
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fingerprint
        id: fp
        run: echo "fingerprint=$(python3 tools/ci/ci_fingerprint.py)" >> "$GITHUB_OUTPUT"
      - name: Look up a pass marker
        id: lookup
        uses: actions/cache/restore@v6.1.0
        with:
          path: .nightly-pass
          key: nightly-pass-${{ steps.fp.outputs.fingerprint }}
      - name: Decide
        id: decide
        env:
          FP: ${{ steps.fp.outputs.fingerprint }}
          HIT: ${{ steps.lookup.outputs.cache-hit }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [[ "$HIT" == "true" && "$FORCE" != "true" ]]; then
            passed="$(cat .nightly-pass/passed 2>/dev/null || echo unknown)"
            echo "Fingerprint $FP already passed the validation: skipping. Reused run: $passed" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Fingerprint $FP: running the validation (marker hit: ${HIT:-false}, force: $FORCE)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  validation:
    name: BRAS validation (linux)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SPATIAL_REQUIRE_RENDER_CLI: "1"
      MAKROOF_REQUIRE_BRAS: "1"
      MAKROOF_BRAS_CACHE: ${{ github.workspace }}/.bras-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/ci/requirements.txt
            tools/acoustics/requirements.txt
            tools/validation/requirements.txt
            tools/validation/requirements-extract.txt
      - name: Install Python dependencies
        run: python -m pip install -r tools/ci/requirements.txt -r tools/acoustics/requirements.txt -r tools/validation/requirements.txt -r tools/validation/requirements-extract.txt
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Build render_cli (release) and a debug render_cli for the bias hook
        run: |
          cmake --preset cli
          cmake --build --preset cli
          cmake -S . -B build/clidebug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSPATIAL_BUILD_PLUGIN=OFF -DSPATIAL_BUILD_TESTS=OFF
          cmake --build build/clidebug --target render_cli

      - name: Cache BRAS files (verified by SHA-256 on every use)
        uses: actions/cache@v6.1.0
        with:
          path: .bras-cache
          key: bras-${{ hashFiles('tools/validation/bras_manifest.json') }}
      - name: Fetch BRAS
        run: python tools/validation/fetch_bras.py --groups docs materials parameters rirs geometry

      - name: Scenes are up to date with the reduction rules
        run: python tools/validation/make_bras_scenes.py --check

      - name: Nightly gate and validation tests
        run: |
          export RENDER_CLI="$PWD/build/cli/render_cli"
          export MAKROOF_DEBUG_RENDER_CLI="$PWD/build/clidebug/render_cli"
          python -m pytest tools/validation -v -rP

      - name: Full a* gate recomputation (phase-05e D-B, minutes)
        run: python -m pytest tools/acoustics/tests/test_radiosity.py -v -rP -m slow

      - name: Comparison report
        if: always()
        run: RENDER_CLI="$PWD/build/cli/render_cli" python tools/validation/run_validation.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: validation-report-phase05
          path: |
            docs/validation/report-phase05.md
            docs/validation/phase05/
            tools/validation/data/phase05_results.json
          if-no-files-found: warn

      # Only a run whose every step above succeeded records the marker (a plain `if` keeps the
      # implicit success(); always() would bypass it).
      - name: Write the pass marker
        if: needs.changes.outputs.run == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p .nightly-pass
          echo "$RUN_URL (commit $SHA)" > .nightly-pass/passed
      - name: Save the pass marker
        if: needs.changes.outputs.run == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .nightly-pass
          key: nightly-pass-${{ needs.changes.outputs.fingerprint }}
