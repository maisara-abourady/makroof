name: CI

on:
  # Maisara, 2026-11-08 (option 2): CI starts by itself exactly once per PR, when it is opened, reopened
  # or marked ready for review. Pushes to an open PR do not start it (CLAUDE.md "When to open a PR":
  # after a fix that a CI failure or the engineer's review called for, rerun it by hand, below).
  # Nothing runs on main or on a schedule.
  pull_request:
    types: [opened, reopened, ready_for_review]
  # Manual run (Actions -> CI -> Run workflow, on the PR's branch); `force` bypasses the skip below.
  workflow_dispatch:
    inputs:
      force:
        description: Run every job even if this tree's fingerprint already passed
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPATIAL_WERROR: "ON"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  # Skip gate. tools/ci/ci_fingerprint.py hashes every tracked file that can change a CI result (all
  # but prose: session briefs, reviews, phase files, PRD, BUILD_PLAN, CLAUDE.md, .claude/). If a run
  # on a tree with the same fingerprint passed every job, its `ci-ok` job left a pass marker in the
  # Actions cache, and this run skips every job (they report "skipped", which counts as passing for
  # required checks). Markers saved on main are visible to every PR; a PR's markers to that PR only.
  changes:
    name: changes (skip if this tree already passed)
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
      reused: ${{ steps.decide.outputs.reused }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fingerprint
        id: fp
        run: echo "fingerprint=$(python3 tools/ci/ci_fingerprint.py)" >> "$GITHUB_OUTPUT"
      # The marker is tiny (the commit and run that passed), so it is restored, not only looked up:
      # a skipped run links the run whose jobs and artifacts (listening pack, plugins) it reuses.
      - name: Look up a pass marker
        id: lookup
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ci-pass
          key: ci-pass-${{ steps.fp.outputs.fingerprint }}
      - name: Decide
        id: decide
        env:
          FP: ${{ steps.fp.outputs.fingerprint }}
          HIT: ${{ steps.lookup.outputs.cache-hit }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [[ "$HIT" == "true" && "$FORCE" != "true" ]]; then
            passed="$(cat .ci-pass/passed 2>/dev/null || echo unknown)"
            echo "Fingerprint $FP already passed CI: skipping every job. Reused run: $passed" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reused=$passed" >> "$GITHUB_OUTPUT"
          else
            echo "Fingerprint $FP: running CI (marker hit: ${HIT:-false}, force: $FORCE)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: clang-format
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Check formatting
        run: CLANG_FORMAT=clang-format-18 tools/ci/check_format.sh

  # Contract boundary check and the Python tests in tools/ci (schema agreement, boundary-check
  # self-test). Cheap, so it runs on all three OSes.
  contract-tools:
    name: contract tools (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-15, name: macos }
          - { os: windows-2022, name: windows }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r tools/ci/requirements.txt
      - name: Boundary check
        run: python tools/ci/check_boundaries.py
      - name: pytest tools/ci
        run: python -m pytest tools/ci -v

  # Phase 02: the Python analysis harness (tools/acoustics) and the tools/ci scripts that use
  # render_cli. Builds render_cli alone (cli preset, no JUCE), runs `pytest tools` with the binary
  # required, and on Linux builds and uploads the listening pack. Runs on all three OSes so the
  # render_cli end-to-end tests and the metrics see every platform.
  python:
    name: python tools (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-15, name: macos }
          - { os: windows-2022, name: windows }
    env:
      SPATIAL_REQUIRE_RENDER_CLI: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/ci/requirements.txt
            tools/acoustics/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r tools/ci/requirements.txt -r tools/acoustics/requirements.txt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Build render_cli
        run: |
          cmake --preset cli
          cmake --build --preset cli

      - name: pytest tools
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export RENDER_CLI="$PWD/build/cli/render_cli.exe"
          else
            export RENDER_CLI="$PWD/build/cli/render_cli"
          fi
          # -rP prints the margins some tests log (click detector, pyroomacoustics agreement).
          # The Phase 04 ensemble gates run in the tail-gates job.
          # The Phase 05 validation gate (marker nightly) runs in .github/workflows/nightly.yml.
          # The full D-B a* gate recomputation (marker slow) runs in nightly.yml; its committed record is gated here.
          python -m pytest tools -v -rP -m "not ensemble and not nightly and not slow"

      - name: Listening pack
        if: runner.os == 'Linux'
        run: python tools/ci/listening_pack.py --phase phase-04 --render-cli build/cli/render_cli

      # Phase 05b: the current full room through every test scene (B11 not promoted: no A/B pair).
      - name: Listening pack (phase-05b)
        if: runner.os == 'Linux'
        run: python tools/ci/listening_pack.py --phase phase-05b --render-cli build/cli/render_cli

      # Phase 06: offline vs real-time drum renders and the IR-switch demo (render_cli --realtime-emulation).
      - name: Listening pack (phase-06)
        if: runner.os == 'Linux'
        run: python tools/ci/listening_pack.py --phase phase-06 --render-cli build/cli/render_cli

      # Phase 05h: the Phase 04 (AX16) tail level against the switched level (render_cli --tail-level ax16 / default).
      - name: Listening pack (phase-05h)
        if: runner.os == 'Linux'
        run: python tools/ci/listening_pack.py --phase phase-05h --render-cli build/cli/render_cli

      # Phase 05e A/B pack (measured BRAS RIR vs simulated): needs the BRAS RIRs, verified by SHA-256
      # on every use (tools/validation/fetch_bras.py), cached like the nightly job.
      - name: Cache BRAS files (listening pack)
        if: runner.os == 'Linux'
        uses: actions/cache@v6.1.0
        with:
          path: .bras-cache
          key: bras-${{ hashFiles('tools/validation/bras_manifest.json') }}
      - name: Listening pack (phase-05f A/B, CR2 CR3 CR4)
        if: runner.os == 'Linux'
        env:
          MAKROOF_BRAS_CACHE: ${{ github.workspace }}/.bras-cache
        run: python tools/ci/listening_pack.py --phase phase-05f --render-cli build/cli/render_cli

      - name: Upload listening pack
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: listening-pack
          path: build/listening-pack
          if-no-files-found: error

  # Phase 04: the AX11 / AX19 / AX23 ensemble gates of the late tail (Eyring, seed and sample-rate
  # gates; up to ~4200 realisations per rate), one test room per job so they run in parallel.
  tail-gates:
    name: tail gates (${{ matrix.name }}, ${{ matrix.room }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        room: [dead_booth, living_room, classroom, club, concert_hall_box, stone_box]
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-15, name: macos }
          - { os: windows-2022, name: windows }
    env:
      SPATIAL_REQUIRE_RENDER_CLI: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/ci/requirements.txt
            tools/acoustics/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r tools/ci/requirements.txt -r tools/acoustics/requirements.txt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - name: Build render_cli
        run: |
          cmake --preset cli
          cmake --build --preset cli
      - name: Ensemble gates
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export RENDER_CLI="$PWD/build/cli/render_cli.exe"
          else
            export RENDER_CLI="$PWD/build/cli/render_cli"
          fi
          python -m pytest tools/acoustics/tests/test_tail.py -v -rP -m ensemble -k "${{ matrix.room }}" --durations=10

  build:
    name: build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-15, name: macos }
          - { os: windows-2022, name: windows }
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # ccache on Linux and macOS only; MSVC + ccache needs extra care and is not worth it yet.
      - name: Set up ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.name }}
          max-size: 500M

      # FetchContent sources and juceaide live in build/<preset>/_deps; the key changes whenever a pin
      # or a cmake helper changes.
      - name: Cache FetchContent (debug)
        uses: actions/cache@v6.1.0
        with:
          path: build/debug/_deps
          key: deps-${{ matrix.name }}-debug-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}

      - name: Cache FetchContent (release)
        uses: actions/cache@v6.1.0
        with:
          path: build/release/_deps
          key: deps-${{ matrix.name }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}

      # ---- Debug: tests ----
      - name: Configure (debug)
        run: cmake --preset debug
      - name: Build (debug)
        run: cmake --build --preset debug
      - name: Test (debug)
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a ctest --preset debug
          else
            ctest --preset debug
          fi

      # ---- Release: plugin binaries, pluginval, auval ----
      - name: Configure (release)
        run: cmake --preset release
      - name: Build (release)
        run: cmake --build --preset release

      # Phase 03/04: ISM and hybrid-IR benchmarks (AQ10 target: IR rebuild <= 50 ms, 20 x 30 x 10 m).
      # Hidden test case, run from the Release build so the number means something; printed to the log.
      - name: Benchmark (release)
        shell: bash
        run: |
          BIN=build/release/tests/unit/spatial_tests
          if [[ "${RUNNER_OS}" == "Windows" ]]; then BIN="$BIN.exe"; fi
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a "$BIN" "[benchmark]" --benchmark-samples 10
          else
            "$BIN" "[benchmark]" --benchmark-samples 10
          fi

      - name: Install AU for validation (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/SpatialScene.component
          cp -R build/release/SpatialScene_artefacts/Release/AU/SpatialScene.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          PLUGINS=(build/release/SpatialScene_artefacts/Release/VST3/SpatialScene.vst3)
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            PLUGINS+=("$HOME/Library/Audio/Plug-Ins/Components/SpatialScene.component")
          fi
          tools/ci/run_pluginval.sh --output-dir build/pluginval-logs "${PLUGINS[@]}"

      - name: auval (macOS)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          run_auval() { auval -v aufx Spsc Mkrf 2>&1 | tee build/auval.log; }
          # AU registration on fresh runners can lag; retry once after poking the registrar.
          if ! run_auval; then
            killall -9 AudioComponentRegistrar || true
            sleep 5
            run_auval
          fi
          grep -q "AU VALIDATION SUCCEEDED" build/auval.log

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/SpatialScene-${{ matrix.name }}
          mkdir -p "$OUT"
          cp -R build/release/SpatialScene_artefacts/Release/VST3/SpatialScene.vst3 "$OUT/"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            cp -R build/release/SpatialScene_artefacts/Release/AU/SpatialScene.component "$OUT/"
            cp -R build/release/SpatialScene_artefacts/Release/Standalone/SpatialScene.app "$OUT/"
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp build/release/SpatialScene_artefacts/Release/Standalone/SpatialScene.exe "$OUT/"
          else
            cp build/release/SpatialScene_artefacts/Release/Standalone/SpatialScene "$OUT/"
          fi
          ls -laR "$OUT"

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SpatialScene-${{ matrix.name }}
          path: artifacts/SpatialScene-${{ matrix.name }}
          if-no-files-found: error

      - name: Upload pluginval and auval logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pluginval-${{ matrix.name }}
          path: |
            build/pluginval-logs
            build/auval.log
          if-no-files-found: warn

  asan:
    name: ASan + UBSan (linux)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: asan
          max-size: 500M
      - name: Cache FetchContent (asan)
        uses: actions/cache@v6.1.0
        with:
          path: build/asan/_deps
          key: deps-linux-asan-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: xvfb-run -a ctest --preset asan

  # Phase 06 (and 07, 10): ThreadSanitizer on the real-time convolver's lock-free IR handover. The
  # "[conv]" tests include one that hammers requestIr from two threads while the audio thread
  # processes; the Phase 07 "[pipeline]" tests (the JUCE-free spatial_plugin_core) run a parameter
  # thread, the IR builder and the audio thread together. The JUCE plugin isn't needed for them, so it
  # isn't built here (much faster).
  tsan:
    name: TSan (linux)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: tsan
          max-size: 500M
      - name: Cache FetchContent (tsan)
        uses: actions/cache@v6.1.0
        with:
          path: build/tsan/_deps
          key: deps-linux-tsan-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}
      - name: Configure
        run: cmake --preset tsan -DSPATIAL_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build --preset tsan --target spatial_tests
      - name: Test (real-time convolution, the Phase 07 scene pipeline and the phase 05h diffuse pool, TSan)
        env:
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: build/tsan/tests/unit/spatial_tests "[conv],[pipeline],[diffuse]"

  # One check that sums the run up (a good candidate for the only required status check). Green when
  # every job passed, or when the gate skipped them all; red otherwise. Only a fully green run records
  # the pass marker, so a cancelled, failed or partly skipped run never lets a later run skip.
  ci-ok:
    name: ci ok
    if: always()
    needs: [changes, format, contract-tools, python, tail-gates, build, asan, tsan]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RUN: ${{ needs.changes.outputs.run }}
          REUSED: ${{ needs.changes.outputs.reused }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [[ "$(echo "$NEEDS" | jq -r '.changes.result')" != "success" ]]; then
            echo "::error::the skip gate did not succeed"; exit 1
          fi
          if [[ "$RUN" == "false" ]]; then want=skipped; else want=success; fi
          bad=$(echo "$NEEDS" | jq -r --arg want "$want" 'del(.changes) | to_entries[] | select(.value.result != $want) | .key')
          if [[ -n "$bad" ]]; then
            echo "::error::jobs not $want: $bad"; exit 1
          fi
          if [[ "$RUN" == "false" ]]; then
            echo "Skipped: this tree's fingerprint passed in $REUSED (jobs and artifacts there)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Write the pass marker
        if: needs.changes.outputs.run == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p .ci-pass
          echo "$RUN_URL (commit $SHA)" > .ci-pass/passed
      - name: Save the pass marker
        if: needs.changes.outputs.run == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .ci-pass
          key: ci-pass-${{ needs.changes.outputs.fingerprint }}
